openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: RestoSmart Restaurant Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: overview
    description: Dashboard overview and summary
  - name: employees
    description: Employee management
  - name: shifts
    description: Shift management
  - name: inventory
    description: Inventory management
  - name: sales
    description: Sales and finances
  - name: discounts
    description: Smart discount management
  - name: reservations
    description: Table reservations
  - name: analytics
    description: Business analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /overview/summary:
    get:
      operationId: getOverviewSummary
      tags: [overview]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewSummary"

  /overview/sales-chart:
    get:
      operationId: getMonthlySalesChart
      tags: [overview]
      summary: Get monthly sales chart data
      responses:
        "200":
          description: Monthly sales data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlySaleData"

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeBody"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    put:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeBody"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /shifts:
    get:
      operationId: listShifts
      tags: [shifts]
      summary: List all shifts
      responses:
        "200":
          description: List of shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      tags: [shifts]
      summary: Create a shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftBody"
      responses:
        "201":
          description: Created shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"

  /shifts/{id}:
    delete:
      operationId: deleteShift
      tags: [shifts]
      summary: Delete a shift
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /shifts/working-now:
    get:
      operationId: getWorkingNow
      tags: [shifts]
      summary: Get employees currently on shift based on current day and time
      responses:
        "200":
          description: Employees working now
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkingNowEmployee"

  /shifts/upcoming-reminders:
    get:
      operationId: getUpcomingShiftReminders
      tags: [shifts]
      summary: Get shifts starting within the next 30 minutes
      responses:
        "200":
          description: Upcoming shift reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftReminder"

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List all inventory items
      responses:
        "200":
          description: List of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/{id}:
    put:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inventory/low-stock:
    get:
      operationId: getLowStockItems
      tags: [inventory]
      summary: Get items below alert threshold
      responses:
        "200":
          description: Low stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List daily sales records
      responses:
        "200":
          description: Sales records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaleRecord"
    post:
      operationId: createSaleRecord
      tags: [sales]
      summary: Create a sales record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleRecordBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleRecord"

  /sales/finances-summary:
    get:
      operationId: getFinancesSummary
      tags: [sales]
      summary: Get financial summary (totals, averages, popular dishes)
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancesSummary"

  /discounts:
    get:
      operationId: getDiscount
      tags: [discounts]
      summary: Get all discount deals
      responses:
        "200":
          description: All deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"

  /discounts/all:
    get:
      operationId: listDeals
      tags: [discounts]
      summary: List all discount deals (flash and scheduled)
      responses:
        "200":
          description: List of deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"

  /discounts/active-status:
    get:
      operationId: getActiveDiscountStatus
      tags: [discounts]
      summary: Get currently active discount (if any)
      responses:
        "200":
          description: Active discount status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveDiscountStatus"

  /discounts/flash:
    post:
      operationId: activateFlashDeal
      tags: [discounts]
      summary: Activate a 30-minute flash discount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashDealRequest"
      responses:
        "201":
          description: Flash deal activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  /discounts/scheduled:
    post:
      operationId: createScheduledDeal
      tags: [discounts]
      summary: Create a recurring scheduled discount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledDealRequest"
      responses:
        "201":
          description: Scheduled deal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  /discounts/blast:
    post:
      operationId: sendDiscountBlast
      tags: [discounts]
      summary: Send a discount notification blast to customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountBlastRequest"
      responses:
        "201":
          description: Blast sent and logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRecord"

  /discounts/{id}/toggle:
    patch:
      operationId: toggleDeal
      tags: [discounts]
      summary: Enable or disable a deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleDealBody"
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  /discounts/{id}:
    delete:
      operationId: deleteDeal
      tags: [discounts]
      summary: Delete a discount deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notifications:
    get:
      operationId: listNotifications
      tags: [discounts]
      summary: Get notification blast log
      responses:
        "200":
          description: Notifications log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationRecord"

  /reservations:
    get:
      operationId: listReservations
      tags: [reservations]
      summary: List all reservations
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a new reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationBody"
      responses:
        "201":
          description: Created reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"

  /reservations/today:
    get:
      operationId: getTodayReservations
      tags: [reservations]
      summary: Get today's reservations
      responses:
        "200":
          description: Today's reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

  /reservations/stats:
    get:
      operationId: getReservationStats
      tags: [reservations]
      summary: Reservation statistics
      responses:
        "200":
          description: Reservation stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationStats"

  /reservations/{id}:
    get:
      operationId: getReservation
      tags: [reservations]
      summary: Get reservation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
    put:
      operationId: updateReservation
      tags: [reservations]
      summary: Update reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReservationBody"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
    delete:
      operationId: deleteReservation
      tags: [reservations]
      summary: Delete reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /reservations/{id}/status:
    patch:
      operationId: patchReservationStatus
      tags: [reservations]
      summary: Update reservation status only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchReservationStatusBody"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"

  /analytics/performance:
    get:
      operationId: getPerformanceAnalytics
      tags: [analytics]
      summary: Get daily and monthly performance analytics
      responses:
        "200":
          description: Performance analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceAnalytics"

  /analytics/daily:
    get:
      operationId: getDailyAnalytics
      tags: [analytics]
      summary: Get daily breakdown for the last 30 days
      responses:
        "200":
          description: Daily analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyAnalyticsEntry"

  /menu:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List all menu items with calculated cost and margin
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [menu]
      summary: Create a new menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemBody"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

  /menu/analytics:
    get:
      operationId: getMenuAnalytics
      tags: [menu]
      summary: Get top profitable dishes ranked by profit margin and total profit
      responses:
        "200":
          description: Menu analytics data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItemAnalytics"

  /menu/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get a single menu item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
    put:
      operationId: updateMenuItem
      tags: [menu]
      summary: Update a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemBody"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
    delete:
      operationId: deleteMenuItem
      tags: [menu]
      summary: Delete a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /menu/{id}/ingredients:
    get:
      operationId: getMenuItemIngredients
      tags: [menu]
      summary: Get all ingredients for a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ingredients for menu item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuIngredient"
    put:
      operationId: setMenuItemIngredients
      tags: [menu]
      summary: Replace all ingredients for a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMenuItemIngredientsBody"
      responses:
        "200":
          description: Updated ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuIngredient"

  /pos/sell:
    post:
      operationId: recordPosSale
      tags: [pos]
      summary: Record a POS sale - deducts ingredients from inventory automatically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPosSaleBody"
      responses:
        "201":
          description: Sale recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSale"

  /pos/sales-log:
    get:
      operationId: listPosSales
      tags: [pos]
      summary: Get recent POS sales log
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of recent POS sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosSale"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OverviewSummary:
      type: object
      properties:
        todayProfit:
          type: number
        todayRevenue:
          type: number
        activeStaff:
          type: integer
        workingNowCount:
          type: integer
        lowStockAlerts:
          type: integer
        tableOccupancy:
          type: integer
        tableTotal:
          type: integer
        tableOccupancyPercent:
          type: number
        todayReservations:
          type: integer
        pendingReservations:
          type: integer
        upcomingShiftReminders:
          type: integer
        liveTraffic:
          type: integer
        expectedRevenue:
          type: number
        activeDiscount:
          type: object
          properties:
            active:
              type: boolean
            label:
              type: string
              nullable: true
            percentage:
              type: number
              nullable: true
            minutesRemaining:
              type: integer
              nullable: true
          required:
            - active
        lowStockItems:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              quantity:
                type: number
              alertThreshold:
                type: number
              unit:
                type: string
            required:
              - id
              - name
              - quantity
              - alertThreshold
              - unit
      required:
        - todayProfit
        - todayRevenue
        - activeStaff
        - workingNowCount
        - lowStockAlerts
        - tableOccupancy
        - tableTotal
        - tableOccupancyPercent
        - todayReservations
        - pendingReservations
        - upcomingShiftReminders
        - liveTraffic
        - expectedRevenue
        - activeDiscount
        - lowStockItems

    MonthlySaleData:
      type: object
      properties:
        month:
          type: string
        revenue:
          type: number
        profit:
          type: number
      required:
        - month
        - revenue
        - profit

    Employee:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [active, inactive]
      required:
        - id
        - name
        - role
        - email
        - phone
        - status

    CreateEmployeeBody:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [active, inactive]
      required:
        - name
        - role
        - email
        - phone

    WorkingNowEmployee:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        shiftStart:
          type: string
        shiftEnd:
          type: string
        dayOfWeek:
          type: string
        minutesUntilEnd:
          type: integer
      required:
        - id
        - name
        - role
        - shiftStart
        - shiftEnd
        - dayOfWeek
        - minutesUntilEnd

    ShiftReminder:
      type: object
      properties:
        employeeId:
          type: integer
        employeeName:
          type: string
        role:
          type: string
        dayOfWeek:
          type: string
        startTime:
          type: string
        minutesUntilStart:
          type: integer
      required:
        - employeeId
        - employeeName
        - role
        - dayOfWeek
        - startTime
        - minutesUntilStart

    Shift:
      type: object
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        dayOfWeek:
          type: string
          enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
        startTime:
          type: string
        endTime:
          type: string
      required:
        - id
        - employeeId
        - employeeName
        - dayOfWeek
        - startTime
        - endTime

    CreateShiftBody:
      type: object
      properties:
        employeeId:
          type: integer
        dayOfWeek:
          type: string
          enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
        startTime:
          type: string
        endTime:
          type: string
      required:
        - employeeId
        - dayOfWeek
        - startTime
        - endTime

    InventoryItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        quantity:
          type: number
        unit:
          type: string
        alertThreshold:
          type: number
        isLowStock:
          type: boolean
        costPerUnit:
          type: number
      required:
        - id
        - name
        - category
        - quantity
        - unit
        - alertThreshold
        - isLowStock
        - costPerUnit

    CreateInventoryItemBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        quantity:
          type: number
        unit:
          type: string
        alertThreshold:
          type: number
        costPerUnit:
          type: number
      required:
        - name
        - category
        - quantity
        - unit
        - alertThreshold
        - costPerUnit

    SaleRecord:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        revenue:
          type: number
        profit:
          type: number
        popularDishes:
          type: array
          items:
            type: string
        covers:
          type: integer
      required:
        - id
        - date
        - revenue
        - profit
        - popularDishes
