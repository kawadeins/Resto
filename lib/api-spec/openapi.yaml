components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OverviewSummary:
      type: object
      properties:
        todayProfit:
          type: number
        todayRevenue:
          type: number
        activeStaff:
          type: integer
        workingNowCount:
          type: integer
        lowStockAlerts:
          type: integer
        tableOccupancy:
          type: integer
        tableTotal:
          type: integer
        tableOccupancyPercent:
          type: number
        todayReservations:
          type: integer
        pendingReservations:
          type: integer
        upcomingShiftReminders:
          type: integer
        liveTraffic:
          type: integer
        expectedRevenue:
          type: number
        activeDiscount:
          type: object
          properties:
            active:
              type: boolean
            label:
              type: string
              nullable: true
            percentage:
              type: number
              nullable: true
            minutesRemaining:
              type: integer
              nullable: true
          required:
            - active
        lowStockItems:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              quantity:
                type: number
              alertThreshold:
                type: number
              unit:
                type: string
            required:
              - id
              - name
              - quantity
              - alertThreshold
              - unit
      required:
        - todayProfit
        - todayRevenue
        - activeStaff
        - workingNowCount
        - lowStockAlerts
        - tableOccupancy
        - tableTotal
        - tableOccupancyPercent
        - todayReservations
        - pendingReservations
        - upcomingShiftReminders
        - liveTraffic
        - expectedRevenue
        - activeDiscount
        - lowStockItems

